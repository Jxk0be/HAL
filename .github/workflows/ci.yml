# HAL CI/CD.
#  - Every PR and push: typecheck, lint, unit tests, build, Edge Function (Deno) tests, and the
#    database linter against the live project.
#  - Push to main: apply new migrations (supabase db push) and deploy the Edge Functions.
#    Netlify builds and deploys the website itself from the repo.
#
# Repository secrets (set for HAL): SUPABASE_ACCESS_TOKEN, SUPABASE_PROJECT_REF, SUPABASE_DB_PASSWORD
# (see docs/DEPLOY.md). Without them the database lint and the deploy steps are skipped, and
# migrations and Edge Functions are deployed by hand.

name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the Rules page bakes in the rulebook's last commit

      - uses: pnpm/action-setup@v4 # version from package.json "packageManager"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck
      - name: Lint
        run: pnpm lint
      - name: Unit tests
        run: pnpm test
      - name: Build
        run: pnpm build

      - uses: denoland/setup-deno@v2
        with:
          deno-version: 2.1.4
      - name: Edge Function tests
        run: deno test --node-modules-dir=none --allow-env supabase/functions

      - uses: supabase/setup-cli@v1
        if: env.SUPABASE_ACCESS_TOKEN != ''
        with:
          version: latest
      - name: Database lint
        if: env.SUPABASE_ACCESS_TOKEN != ''
        run: |
          supabase link --project-ref "$SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"
          supabase db lint --linked --level warning --fail-on error

  deploy:
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - name: Skip without Supabase secrets
        if: env.SUPABASE_ACCESS_TOKEN == ''
        run: echo "::notice::No Supabase secrets set; deploy migrations and Edge Functions by hand (docs/DEPLOY.md)."
      - uses: actions/checkout@v4
        if: env.SUPABASE_ACCESS_TOKEN != ''
      - uses: supabase/setup-cli@v1
        if: env.SUPABASE_ACCESS_TOKEN != ''
        with:
          version: latest
      - name: Link project
        if: env.SUPABASE_ACCESS_TOKEN != ''
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"
      - name: Apply new migrations
        if: env.SUPABASE_ACCESS_TOKEN != ''
        run: supabase db push --linked
      # verify_jwt = false for all three is set in supabase/config.toml: discord-interactions checks
      # Discord's signature, and discord-sync / discord-scheduler check the shared secret header
      # (pg_net can't send a JWT).
      - name: Deploy Edge Functions
        if: env.SUPABASE_ACCESS_TOKEN != ''
        run: supabase functions deploy discord-interactions discord-sync discord-scheduler --project-ref "$SUPABASE_PROJECT_REF" --use-api
