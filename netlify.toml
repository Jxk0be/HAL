# Netlify builds the web app from the repo root (pnpm workspace). Edge Functions and the database
# deploy from GitHub Actions (.github/workflows/ci.yml), not from Netlify.

[build]
  base = "/"
  command = "pnpm --filter web build"
  publish = "apps/web/dist"

[build.environment]
  NODE_VERSION = "22"

# Single-page app: every route is served by index.html.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    # Only the hosts HAL talks to. Add a host here before using it in the app, or production blocks it.
    #  - Supabase: API, Auth, Storage (logos, signed screenshot URLs), Realtime (wss)
    #  - GitHub: the rulebook (raw.githubusercontent.com) and its commit history (api.github.com)
    #  - Discord CDN: player avatars
    #  - Google Fonts: allowed for future use (fonts are self-hosted via Fontsource today)
    Content-Security-Policy = """
      default-src 'self';
      script-src 'self';
      style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;
      font-src 'self' data: https://fonts.gstatic.com;
      img-src 'self' data: blob: https://lluwzpwiybvgnsimpwey.supabase.co https://cdn.discordapp.com https://media.discordapp.net;
      connect-src 'self' https://lluwzpwiybvgnsimpwey.supabase.co wss://lluwzpwiybvgnsimpwey.supabase.co https://raw.githubusercontent.com https://api.github.com;
      frame-src 'none';
      frame-ancestors 'none';
      object-src 'none';
      base-uri 'self';
      form-action 'self';
      upgrade-insecure-requests
    """
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=()"
    Cross-Origin-Opener-Policy = "same-origin"

# Vite puts a content hash in every asset name, so they can be cached forever.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# The app shell must always be fresh so a deploy takes effect immediately.
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
